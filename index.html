<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jie Ann - 个人作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Work Card */
        .work-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .work-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .work-info {
            padding: 30px 40px;
        }

        .work-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .work-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .work-description {
            color: #4a5568;
            line-height: 1.8;
            font-size: 1rem;
        }

        .work-description p {
            margin-bottom: 12px;
        }

        .work-description p:last-child {
            margin-bottom: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        footer a {
            color: white;
            text-decoration: underline;
            opacity: 0.9;
        }

        footer a:hover {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            header p {
                font-size: 0.95rem;
            }

            .work-info {
                padding: 20px 25px;
            }

            .work-title {
                font-size: 1.4rem;
            }

            .work-meta {
                gap: 10px;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .work-card {
            animation: fadeInUp 0.8s ease-out;
        }

        header {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Jie Ann 的作品集</h1>
            <p>探索文学 · 分享思考 · 记录成长</p>
        </header>

        <main>
            <article class="work-card">
                <div class="video-container">
                    <video controls poster="" preload="metadata">
                        <source src="百年孤独_完整讲解视频_压缩版.mp4" type="video/mp4">
                        您的浏览器不支持视频播放，请升级浏览器或下载视频观看。
                    </video>
                </div>
                <div class="work-info">
                    <h2 class="work-title">百年孤独名著讲解</h2>
                    <div class="work-meta">
                        <span class="meta-tag">文学解读</span>
                        <span class="meta-tag">视频讲解</span>
                        <span class="meta-tag">经典名著</span>
                    </div>
                    <div class="work-description">
                        <p>《百年孤独》是哥伦比亚作家加西亚·马尔克斯的代表作，也是拉丁美洲魔幻现实主义文学的巅峰之作。本视频将带领你深入解读这部不朽的文学巨著。</p>
                        <p>视频涵盖了布恩迪亚家族七代人的传奇故事，分析了魔幻现实主义的艺术手法，探讨了孤独、命运、时间等核心主题，帮助你更好地理解这部被誉为"再现拉丁美洲历史社会图景的鸿篇巨著"。</p>
                    </div>
                </div>
            </article>
        </main>

        <footer>
            <p>&copy; 2026 Jie Ann. All rights reserved.</p>
            <p style="margin-top: 8px;">
                <a href="https://github.com/JIE13-maker/jie-ann13" target="_blank">GitHub 仓库</a>
            </p>
        </footer>
    </div>
</body>
</html>
